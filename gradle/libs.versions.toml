[versions]
assertj = "3.27.7"
checkstyle = "14.3.0"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
# @keep read by build.gradle.kts, not referenced by a library
java-release = "17"
# @keep read by build.gradle.kts, not referenced by a library
java-toolchain = "25"
jspecify = "1.0.1"
junit = "6.1.3"
nullaway = "0.14.2"
pmd = "7.28.0"
poi = "5.5.1"
spotbugs-plugin = "6.5.13"
spotbugs-tool = "4.10.5"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
pmd = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
spotbugs = { module = "com.github.spotbugs:spotbugs", version.ref = "spotbugs-tool" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
version-catalog-update = "nl.littlerobots.version-catalog-update:1.1.1"
