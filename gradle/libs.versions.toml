[versions]
java-release = "17"
java-toolchain = "25"
checkstyle = "13.0.0"
pmd = "7.20.0"
spotbugs-plugin = "6.0.27"
spotbugs-tool = "4.9.8"
errorprone-plugin = "5.0.0"
errorprone = "2.46.0"
nullaway = "0.13.1"
jspecify = "1.0.0"
assertj = "3.27.6"
junit = "6.0.2"
poi = "5.5.1"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
pmd = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
