name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Run Gradle tests
        run: ./gradlew test -PtoolchainVersion=${{ matrix.java }}
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run Checkstyle
        id: checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Collect SARIF files into build/sarif/checkstyle
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sarif/checkstyle
          
          while IFS= read -r file; do
            rel="${file#./}"
            module="${rel%%/*}"
            base="$(basename "$file")"
            cp "$file" "build/sarif/checkstyle/${module}-${base}"
          done < <(find . -path "*/build/reports/checkstyle/*.sarif" -type f | sort)

      - name: Merge Checkstyle SARIF
        if: always() && github.event_name == 'pull_request'
        uses: microsoft/sarif-actions@v0.2
        with:
          # paths for output file are not supported - build/sarif/checkstyle.sarif will be converted to
          # build.sarif.checkstyle.sarif, so the output filename is just checkstyle.sarif
          command: merge --merge-runs --output-file checkstyle.sarif build/sarif/checkstyle/*.sarif

      - name: Upload merged Checkstyle SARIF
        if: always() && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkstyle.sarif
          category: checkstyle

  checkstylereviewdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Setup reviewdog
        if: always() && github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Report Checkstyle via reviewdog (GitHub Check)
        if: always() && github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t reports < <(find . -path "*/build/reports/checkstyle/*.sarif" -type f | sort)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No checkstyle SARIF reports found."
            exit 0
          fi

          for r in "${reports[@]}"; do
            # name can be anything; I include the module-ish prefix for clarity
            name="checkstyle:$(echo "${r#./}" | sed 's#/build/reports/checkstyle/.*##')"
            cat "$r" | reviewdog \
              -f=sarif \
              -name="$name" \
              -reporter=github-check \
              -filter-mode=diff_context \
              -level=info
          done
  pmd:
    name: PMD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Run PMD
        run: ./gradlew pmdMain pmdTest
        id: pmd
