name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Run Gradle tests
        run: ./gradlew test -PtoolchainVersion=${{ matrix.java }}
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Setup reviewdog
        if: always() && github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Report Checkstyle via reviewdog (GitHub Check)
        if: always() && github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t reports < <(find . -path "*/build/reports/checkstyle/*.sarif" -type f | sort)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No checkstyle SARIF reports found."
            exit 0
          fi

          for r in "${reports[@]}"; do
            cat "$r" | reviewdog \
              -f=sarif \
              -name="Checkstyle" \
              -reporter=github-pr-check \
              -filter-mode=diff_context \
              -level=error
          done

  pmd:
    name: PMD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Run PMD
        run: ./gradlew pmdMain pmdTest
        id: pmd
