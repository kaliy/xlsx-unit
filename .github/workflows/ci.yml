name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Run Gradle tests
        run: ./gradlew test -PtoolchainVersion=${{ matrix.java }}
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run Checkstyle
        id: checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Collect SARIF files into build/sarif/checkstyle
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sarif/checkstyle
          
          while IFS= read -r file; do
            rel="${file#./}"
            module="${rel%%/*}"
            base="$(basename "$file")"
            cp "$file" "build/sarif/checkstyle/${module}-${base}"
          done < <(find . -path "*/build/reports/checkstyle/*.sarif" -type f | sort)

      - name: Print collected Checkstyle SARIF files
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "Collected Checkstyle SARIF files:"
          ls -la build/sarif/checkstyle || true
          for f in build/sarif/checkstyle/*.sarif; do
            if [ -f "$f" ]; then
              echo "----- $f -----"
              cat "$f"
              echo
            fi
          done

      - name: Add unique runAutomationDetails.id to each SARIF
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          
          out_dir = Path("build/sarif/checkstyle")
          for p in sorted(out_dir.glob("*.sarif")):
              data = json.loads(p.read_text(encoding="utf-8"))
              if not data.get("runs"):
                  continue
              run = data["runs"][0]
              run["automationDetails"] = {"id": f"checkstyle:{p.stem}"}
              p.write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          PY

      - name: Print processed Checkstyle SARIF files
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "Processed Checkstyle SARIF files:"
          ls -la build/sarif/checkstyle || true
          for f in build/sarif/checkstyle/*.sarif; do
            if [ -f "$f" ]; then
              echo "----- $f -----"
              cat "$f"
              echo
            fi
          done

      - name: Upload Checkstyle SARIF directory
        if: always() && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/sarif/checkstyle
  pmd:
    name: PMD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Run PMD
        run: ./gradlew pmdMain pmdTest
        id: pmd
