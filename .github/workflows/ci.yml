name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21", "25"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Run Gradle tests
        run: ./gradlew test -PtoolchainVersion=${{ matrix.java }}

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Run Checkstyle
        id: checkstyle
        run: ./gradlew checkstyleMain checkstyleTest
      - name: Annotate PR with Checkstyle
        if: always() && github.event_name == 'pull_request'
        uses: lcollins/checkstyle-github-action@v3.1.0
        with:
          path: '**/reports/checkstyle/*.xml'

  pmd:
    name: PMD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Run PMD
        run: ./gradlew pmdMain pmdTest
        id: pmd
      - name: Annotate PR with PMD
        if: always() && github.event_name == 'pull_request'
        uses: lcollins/pmd-github-action@v3.1.0
        with:
          path: '**/reports/pmd/*.xml'
