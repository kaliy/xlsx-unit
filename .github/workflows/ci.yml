name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21", "25"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Run Gradle tests
        run: ./gradlew test -PtoolchainVersion=${{ matrix.java }}
  checkstyle_m:
    name: Checkstyle-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run Checkstyle
        id: checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Collect SARIF files into build/sarif/checkstyle
        if: always() && github.event_name == 'pull_request'
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sarif/checkstyle
  
          # Copy and prefix with module dir to avoid collisions
          while IFS= read -r file; do
            rel="${file#./}"                 # strip leading "./"
            module="${rel%%/*}"              # first path segment = module
            base="$(basename "$file")"
            cp "$file" "build/sarif/checkstyle/${module}-${base}"
          done < <(find . -path "*/build/reports/checkstyle/*.sarif" -type f | sort)
  
          count="$(find build/sarif/checkstyle -type f -name '*.sarif' | wc -l | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Collected $count SARIF files:"
          find build/sarif/checkstyle -type f -name '*.sarif' -print

      - name: Merge Checkstyle SARIF
        if: always() && github.event_name == 'pull_request' && steps.collect.outputs.count != '0'
        uses: microsoft/sarif-actions@v0.2
        with:
          # Use find to expand folder contents into args
          command: merge --merge-runs --force --output-file build/sarif/checkstyle.sarif build/sarif/checkstyle/*.sarif

      - name: Upload merged Checkstyle SARIF
        if: always() && github.event_name == 'pull_request' && steps.collect.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/sarif/checkstyle.sarif
          category: checkstyle
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    outputs:
      sarif_matrix: ${{ steps.sarif_matrix.outputs.matrix }}
      has_sarif: ${{ steps.sarif_matrix.outputs.has_sarif }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Run Checkstyle
        id: checkstyle
        run: ./gradlew checkstyleMain checkstyleTest
      - name: Build Checkstyle SARIF matrix
        id: sarif_matrix
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os
          files = sorted(glob.glob("*/build/reports/checkstyle/*.sarif"))
          matrix = []
          for path in files:
              module = path.split("/", 1)[0]
              base = os.path.basename(path).replace(".sarif", "")
              category = f"checkstyle-{module}-{base}"
              matrix.append({"file": path, "category": category})
          has_sarif = "true" if matrix else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_sarif={has_sarif}\n")
              fh.write(f"matrix={json.dumps(matrix)}\n")
          PY

  checkstyle_sarif:
    name: Checkstyle SARIF
    runs-on: ubuntu-latest
    needs: checkstyle
    if: always() && needs.checkstyle.outputs.has_sarif == 'true'
    strategy:
      matrix:
        include: ${{ fromJson(needs.checkstyle.outputs.sarif_matrix) }}
    steps:
      - name: Upload Checkstyle SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.file }}
          category: ${{ matrix.category }}

  checkstyle_sarif_merge:
    name: Checkstyle SARIF (merge test)
    runs-on: ubuntu-latest
    needs: checkstyle
    if: always() && needs.checkstyle.outputs.has_sarif == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install SARIF Multitool
        run: dotnet tool install --global Microsoft.CodeAnalysis.Sarif.Multitool
      - name: Merge Checkstyle SARIF
        run: |
          mkdir -p build/sarif/merged
          sarif merge --merge-runs --output build/sarif/merged/checkstyle-merged.sarif */build/reports/checkstyle/*.sarif
      - name: Upload merged SARIF (expected to fail)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/sarif/merged/checkstyle-merged.sarif
          category: checkstyle
  pmd:
    name: PMD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Run PMD
        run: ./gradlew pmdMain pmdTest
        id: pmd
